schema_version: 1
id: clean-cartoon
name: Clean Cartoon
summary: 'Friendly modern webcomic cartooning: confident uniform outlines, flat bright color with one
  soft shadow tone, simple characters on moderately detailed backgrounds.'
sources:
  - Contemporary webcomic practice
prompts: []
abstraction: cartoon
line:
  weight_px: 4.0
  uniform: true
  color: '#1b1b1f'
color:
  flat: true
  anchors: []
  guidance: Bright but not saturated; one darker tone per fill for shadow.
shading: One flat shadow tone per shape; no texture.
lettering:
  dialogue:
    family: Comic Neue
    weight: 700
    size: 30.0
    uppercase: false
  caption:
    family: Comic Neue
    weight: 700
    size: 26.0
    uppercase: false
  sfx:
    family: Bangers
    weight: 400
    size: 64.0
    uppercase: false
  title:
    family: Bangers
    weight: 400
    size: 64.0
    uppercase: false
  device:
    family: Work Sans
    weight: 700
    size: 26.0
    uppercase: false
  balloon: ellipse
  balloon_fill: '#ffffff'
  caption_fill: '#fff4c2'
  stroke_px: 3.0
  tail: wedge
  caption_style: box
  padding_em: 0.6
  emphasis_weight: 700
  sfx_style:
    fill: accent
    outline: '#1b1b1f'
    outline_px: 4.0
    halo: '#ffffff'
    halo_px: 10.0
    shadow_px: 0.0
    max_rotation_deg: 12.0
    scale: 1.0
panel:
  border_px: 4.0
  corner_radius_px: 0.0
  paper: '#fbf7f0'
  ink: '#1b1b1f'
effects: []
svg_notes: ''
