schema_version: 1
id: manga-screentone
name: Manga Screentone
summary: 'Black-and-white manga: tapered pen lines, gray values from screentone dots, big expressive eyes,
  solid blacks for hair.'
sources:
  - Hirohiko Araki, Manga in Theory and Practice (2017)
  - Wikipedia, 'Screentone'
prompts: []
abstraction: cartoon
line:
  weight_px: 3.0
  uniform: false
  color: '#000000'
color:
  max_colors: 4
  flat: true
  anchors:
    - '#000000'
    - '#FFFFFF'
    - '#D9D9D9'
    - '#9A9A9A'
  guidance: 'Monochrome only: black, white, and two grays standing in for screentone.'
shading: Screentone (added by the renderer) and cross-hatching; white highlight shapes in solid 
  black hair.
lettering:
  dialogue:
    family: Comic Neue
    weight: 700
    size: 28.0
    uppercase: true
  caption:
    family: Comic Neue
    weight: 400
    size: 24.0
    uppercase: true
  sfx:
    family: Bangers
    weight: 400
    size: 76.0
    uppercase: false
  title:
    family: Bangers
    weight: 400
    size: 64.0
    uppercase: false
  device:
    family: Work Sans
    weight: 700
    size: 24.0
    uppercase: false
  balloon: ellipse
  balloon_fill: '#ffffff'
  caption_fill: '#fff4c2'
  stroke_px: 2.5
  tail: straight
  caption_style: box
  padding_em: 0.45
  emphasis_weight: 700
  sfx_style:
    fill: ink
    outline_px: 0.0
    halo: '#ffffff'
    halo_px: 12.0
    shadow_px: 0.0
    max_rotation_deg: 18.0
    scale: 1.3
panel:
  border_px: 3.0
  corner_radius_px: 0.0
  paper: '#ffffff'
  ink: '#000000'
effects:
  - kind: monochrome
  - kind: halftone
    target: backdrop
    spacing_px: 8.0
    radius_px: 1.8
    angle_deg: 45.0
    color: '#000000'
    opacity: 0.22
svg_notes: Eyes are 1/4–1/3 of face height; draw grays as flat light/mid gray fills; key lines as 
  filled tapered shapes.
