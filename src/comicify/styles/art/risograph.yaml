schema_version: 1
id: risograph
name: Risograph Zine
summary: Two or three spot-color layers, overprinted and slightly misregistered, with coarse 
  halftones and paper grain.
sources:
  - Stencil Riso color list (stencil.wiki/colors)
  - RISO Kagaku ink color list
prompts: []
abstraction: cartoon
line:
  weight_px: 4.0
  uniform: false
  color: '#3D5588'
color:
  max_colors: 5
  flat: true
  anchors:
    - '#FF48B0'
    - '#0078BF'
    - '#FFE800'
    - '#3D5588'
    - '#F4F0E6'
  guidance: Pick fluoro pink, blue and the paper; tints only via halftone; overlaps darken 
    (multiply).
shading: Coarse halftone tints and overprint (added by the renderer).
lettering:
  dialogue:
    family: Space Mono
    weight: 700
    size: 26.0
    uppercase: false
  caption:
    family: Space Mono
    weight: 400
    size: 22.0
    uppercase: false
  sfx:
    family: Archivo Black
    weight: 400
    size: 60.0
    uppercase: false
  title:
    family: Archivo Black
    weight: 400
    size: 60.0
    uppercase: false
  device:
    family: Space Mono
    weight: 700
    size: 22.0
    uppercase: false
  balloon: rounded
  balloon_fill: '#F4F0E6'
  caption_fill: '#FFE800'
  stroke_px: 3.0
  tail: straight
  caption_style: bar
  padding_em: 0.6
  emphasis_weight: 700
  sfx_style:
    fill: '#FF48B0'
    outline_px: 0.0
    halo_px: 0.0
    shadow: '#0078BF'
    shadow_px: 4.0
    max_rotation_deg: 8.0
    scale: 1.0
panel:
  border_px: 3.5
  corner_radius_px: 0.0
  paper: '#F4F0E6'
  ink: '#3D5588'
effects:
  - kind: misregister
    dx_px: 4.0
    dy_px: 2.5
    color: '#FF48B0'
    opacity: 0.45
  - kind: halftone
    target: backdrop
    spacing_px: 12.0
    radius_px: 3.2
    angle_deg: 15.0
    color: '#0078BF'
    opacity: 0.22
  - kind: grain
    opacity: 0.16
    frequency: 0.8
svg_notes: Linework in dark blue, not black; flat spot-color fills only.
