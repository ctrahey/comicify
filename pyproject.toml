[project]
name = "comicify"
version = "0.1.0"
description = "Product comics from VCS-tracked structured intermediates"
readme = "README.md"
authors = [
    { name = "Chris Trahey", email = "christrahey@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.68.0",
    "img2pdf>=0.6.3",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "pydantic-ai-slim[anthropic]>=2.71.0",
    "resvg-py>=0.5.0",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.29.2",
]

[project.scripts]
comicify = "comicify:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
